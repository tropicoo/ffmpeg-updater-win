[project]
name = "ffmpeg-updater-win"
version = "0.4.14"
description = "ffmpeg binaries updater for Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.11",
    "loguru>=0.7.3",
    "packaging>=25.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "typer>=0.15.1",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.163.0",
    "pylint>=4.0.4",
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.14.13",
    "semgrep>=1.172.0",
    "ty>=0.0.12",
]

[project.scripts]
ffmpeg-updater-win = "ffmpeg_updater_win:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"
required-version = ">=0.9"
extend-exclude = ["**/third_party/*"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN002",
    "ANN003",
    "ANN401",
    "ASYNC109",
    "ASYNC110",
    "B008",
    "BLE001",
    "COM812",
    "CPY001",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D203",
    "D213",
    "E501",
    "EM101",
    "EM102",
    "FAST002",
    "FBT001",
    "FBT002",
    "FIX002",
    "INP001",
    "ISC001",
    "PERF401",
    "PLE1205",
    "TD002",
    "TD003",
    "TRY003",
]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"
line-ending = "lf"
docstring-code-format = true

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
