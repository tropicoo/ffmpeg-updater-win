[project]
name = "ffmpeg-updater-win"
version = "0.4.15"
description = "ffmpeg binaries updater for Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.11",
    "loguru>=0.7.3",
    "packaging>=25.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "typer>=0.15.1",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.163.0",
    "pylint>=4.0.4",
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.14.13",
    "semgrep>=1.172.0",
    "ty>=0.0.12",
]

[project.scripts]
ffmpeg-updater-win = "ffmpeg_updater_win:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"
required-version = ">=0.9"
extend-exclude = ["**/third_party/*"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflict with the ruff formatter.
    "COM812",
    "E501",
    "ISC001",
    # Mutually incompatible with D211/D212, which are preferred.
    "D203",
    "D213",
    # No copyright headers in this project.
    "CPY001",
    # Typer needs `typer.Option()` calls as argument defaults.
    "B008",
    # Typer maps boolean flags to positional boolean parameters.
    "FBT001",
    # `*args`/`**kwargs` are pass-through to base classes.
    "ANN002",
    "ANN003",
    # `get_stdout` intentionally exposes its own `timeout` argument.
    "ASYNC109",
    # False positive for loguru's brace-style lazy formatting.
    "PLE1205",
]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"
line-ending = "lf"
docstring-code-format = true

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
project-excludes = ["src/ffmpeg_updater_win/app/third_party"]
